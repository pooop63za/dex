<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Pizza Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f0fdf4; }
        .fraction { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; vertical-align: middle; margin: 0 0.5rem; font-weight: bold; }
        .fraction span:first-child { border-bottom: 2px solid currentColor; padding: 0 0.2rem; }
        .pizza-shadow { filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.15)); transition: all 0.3s ease; }
        .btn-press:active { transform: translateY(2px); }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom styling for the glowing success state */
        .success-glow { box-shadow: 0 0 20px 5px rgba(34, 197, 94, 0.5); border-color: #22c55e; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4">

    <header class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-green-700 mb-2 drop-shadow-sm">🍕 Cyber Pizza Factory 🍕</h1>
        <p class="text-lg text-gray-700">ภารกิจสับพิซซ่าให้ชิ้นเท่ากัน ก่อนนำไปใส่กล่อง!</p>
        <div class="mt-4 inline-block bg-yellow-300 text-yellow-900 px-4 py-1 rounded-full font-bold shadow-sm">
            ด่านที่ <span id="level-display">1</span>/3
        </div>
    </header>

    <main class="w-full max-w-5xl bg-white rounded-3xl shadow-xl p-6 md:p-10 border-4 border-green-100 flex flex-col items-center">
        
        <!-- Status Message -->
        <div id="status-message" class="text-xl font-bold text-blue-600 mb-6 bg-blue-50 px-6 py-2 rounded-2xl border-2 border-blue-200 transition-colors duration-300 text-center w-full max-w-2xl">
            ชิ้นพิซซ่ายังขนาดไม่เท่ากัน! ลองใช้เครื่องสับ (x) เพิ่มดูสิ
        </div>

        <div class="flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16 w-full">
            
            <!-- Pizza 1 Area -->
            <div class="flex flex-col items-center bg-gray-50 p-6 rounded-2xl border-2 border-gray-200 w-full md:w-1/2" id="pizza1-container">
                <h2 class="text-xl font-bold text-gray-700 mb-4">ถาดที่ 1</h2>
                
                <!-- SVG Container -->
                <div id="pizza1-svg" class="w-48 h-48 mb-6 pizza-shadow"></div>
                
                <!-- Multiplier Controls -->
                <div class="flex items-center gap-4 bg-white p-3 rounded-xl shadow-inner border border-gray-100">
                    <button onclick="changeMult(1, -1)" class="w-10 h-10 bg-red-400 hover:bg-red-500 text-white rounded-full font-bold text-xl btn-press shadow">-</button>
                    <div class="text-center">
                        <div class="text-sm text-gray-500">เครื่องสับชิ้น</div>
                        <div class="font-bold text-lg text-gray-800">x <span id="mult1-display">1</span></div>
                    </div>
                    <button onclick="changeMult(1, 1)" class="w-10 h-10 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold text-xl btn-press shadow">+</button>
                </div>

                <!-- Abstract Math Eq -->
                <div class="mt-6 text-2xl font-bold text-gray-800 flex items-center bg-yellow-50 px-4 py-2 rounded-lg">
                    <div class="fraction text-blue-700">
                        <span id="p1-num-base">1</span>
                        <span id="p1-den-base">2</span>
                    </div>
                    <span class="text-gray-400 mx-2 text-lg">แปลงร่าง</span>
                    <div class="fraction">
                        <span id="p1-num-current">1</span>
                        <span id="p1-den-current">2</span>
                    </div>
                </div>
            </div>

            <!-- Plus Sign -->
            <div class="text-5xl font-black text-gray-300 hidden md:block">+</div>

            <!-- Pizza 2 Area -->
            <div class="flex flex-col items-center bg-gray-50 p-6 rounded-2xl border-2 border-gray-200 w-full md:w-1/2" id="pizza2-container">
                <h2 class="text-xl font-bold text-gray-700 mb-4">ถาดที่ 2</h2>
                
                <div id="pizza2-svg" class="w-48 h-48 mb-6 pizza-shadow"></div>
                
                <div class="flex items-center gap-4 bg-white p-3 rounded-xl shadow-inner border border-gray-100">
                    <button onclick="changeMult(2, -1)" class="w-10 h-10 bg-red-400 hover:bg-red-500 text-white rounded-full font-bold text-xl btn-press shadow">-</button>
                    <div class="text-center">
                        <div class="text-sm text-gray-500">เครื่องสับชิ้น</div>
                        <div class="font-bold text-lg text-gray-800">x <span id="mult2-display">1</span></div>
                    </div>
                    <button onclick="changeMult(2, 1)" class="w-10 h-10 bg-blue-500 hover:bg-blue-600 text-white rounded-full font-bold text-xl btn-press shadow">+</button>
                </div>

                <div class="mt-6 text-2xl font-bold text-gray-800 flex items-center bg-yellow-50 px-4 py-2 rounded-lg">
                    <div class="fraction text-purple-700">
                        <span id="p2-num-base">1</span>
                        <span id="p2-den-base">3</span>
                    </div>
                    <span class="text-gray-400 mx-2 text-lg">แปลงร่าง</span>
                    <div class="fraction">
                        <span id="p2-num-current">1</span>
                        <span id="p2-den-current">3</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Area -->
        <div class="mt-10 flex flex-col items-center w-full">
            <button id="merge-btn" onclick="mergePizzas()" disabled class="bg-gray-300 text-gray-500 px-10 py-4 rounded-2xl font-bold text-2xl transition-all duration-300 shadow-md cursor-not-allowed">
                รวมถาดพิซซ่า! (ต้องการชิ้นเท่ากัน)
            </button>

            <!-- Result Box (Hidden initially) -->
            <div id="result-area" class="hidden mt-8 flex flex-col items-center fade-in bg-green-50 w-full p-8 rounded-2xl border-4 border-green-200">
                <h3 class="text-2xl font-bold text-green-700 mb-6">🎉 รวมร่างสำเร็จ! ได้พิซซ่าทั้งหมด 🎉</h3>
                <div id="result-svg" class="w-56 h-56 mb-6 pizza-shadow"></div>
                
                <!-- Final Equation -->
                <div class="text-3xl font-black text-gray-800 flex items-center flex-wrap justify-center gap-2">
                    <div class="fraction">
                        <span id="res-eq-n1">3</span>
                        <span id="res-eq-d1">6</span>
                    </div>
                    <span class="text-green-600">+</span>
                    <div class="fraction">
                        <span id="res-eq-n2">2</span>
                        <span id="res-eq-d2">6</span>
                    </div>
                    <span class="text-green-600">=</span>
                    <div class="fraction text-red-600 text-4xl">
                        <span id="res-final-n">5</span>
                        <span id="res-final-d">6</span>
                    </div>
                </div>

                <button onclick="nextLevel()" id="next-level-btn" class="mt-8 bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-xl font-bold text-xl btn-press shadow-lg">
                    ไปภารกิจต่อไป ➔
                </button>
            </div>
        </div>
    </main>

    <script>
        // Game State
        const levels = [
            { n1: 1, d1: 2, n2: 1, d2: 3, c1: '#3b82f6', c2: '#a855f7' }, // 1/2 + 1/3 (Blue & Purple)
            { n1: 1, d1: 4, n2: 3, d2: 8, c1: '#ef4444', c2: '#f59e0b' }, // 1/4 + 3/8 (Red & Orange)
            { n1: 1, d1: 3, n2: 2, d2: 5, c1: '#10b981', c2: '#ec4899' }  // 1/3 + 2/5 (Green & Pink)
        ];
        let currentLevelIndex = 0;
        let mult1 = 1;
        let mult2 = 1;
        let isMerged = false;

        // Colors
        const CRUST_COLOR = '#fcd34d';
        const BG_COLOR = '#fef3c7';
        const LINE_COLOR = '#b45309';

        // Initialize Level
        function loadLevel() {
            const level = levels[currentLevelIndex];
            mult1 = 1;
            mult2 = 1;
            isMerged = false;

            document.getElementById('level-display').innerText = currentLevelIndex + 1;
            
            // Set base numbers
            document.getElementById('p1-num-base').innerText = level.n1;
            document.getElementById('p1-den-base').innerText = level.d1;
            document.getElementById('p2-num-base').innerText = level.n2;
            document.getElementById('p2-den-base').innerText = level.d2;

            // Reset UI
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('pizza1-container').classList.remove('hidden');
            document.getElementById('pizza2-container').classList.remove('hidden');
            document.querySelector('.text-5xl.text-gray-300').classList.remove('hidden'); // Plus sign
            document.getElementById('merge-btn').classList.remove('hidden');
            
            // If it's the end of the game
            if(currentLevelIndex >= levels.length) {
                document.querySelector('main').innerHTML = `<h2 class="text-4xl font-bold text-green-600 py-20 text-center fade-in">🎉 เก่งมาก! คุณคือยอดฝีมือโรงงานพิซซ่า! 🎉</h2><button onclick="location.reload()" class="bg-blue-500 text-white px-6 py-3 rounded-xl font-bold mt-4">เล่นอีกครั้ง</button>`;
                return;
            }

            updateView();
        }

        // Draw SVG Pie Chart
        function createPizzaSVG(num, den, mult, color, drawAllActive = false, totalActiveOverride = 0) {
            const totalSlices = den * mult;
            const activeSlices = drawAllActive ? totalActiveOverride : num * mult;
            
            let svg = `<svg viewBox="-1.1 -1.1 2.2 2.2" class="w-full h-full transform -rotate-90">`;
            // Crust
            svg += `<circle cx="0" cy="0" r="1.05" fill="${CRUST_COLOR}" />`;
            // Dough/Background
            svg += `<circle cx="0" cy="0" r="0.95" fill="${BG_COLOR}" />`;

            const percent = 1 / totalSlices;
            
            for(let i = 0; i < totalSlices; i++) {
                // Calculate wedge coordinates
                const startX = Math.cos(2 * Math.PI * (i * percent)) * 0.95;
                const startY = Math.sin(2 * Math.PI * (i * percent)) * 0.95;
                const endX = Math.cos(2 * Math.PI * ((i+1) * percent)) * 0.95;
                const endY = Math.sin(2 * Math.PI * ((i+1) * percent)) * 0.95;
                
                // SVG Arc Command
                const largeArcFlag = percent > 0.5 ? 1 : 0;
                const pathData = [
                    `M 0 0`,
                    `L ${startX} ${startY}`,
                    `A 0.95 0.95 0 ${largeArcFlag} 1 ${endX} ${endY}`,
                    `Z`
                ].join(' ');

                const fillColor = i < activeSlices ? color : 'transparent';
                svg += `<path d="${pathData}" fill="${fillColor}" stroke="${LINE_COLOR}" stroke-width="0.03" stroke-linejoin="round"/>`;
            }
            svg += `</svg>`;
            return svg;
        }

        function changeMult(pizzaNum, delta) {
            if (isMerged) return; // Prevent changes after merging

            if (pizzaNum === 1) {
                if (mult1 + delta >= 1 && mult1 + delta <= 10) mult1 += delta;
            } else {
                if (mult2 + delta >= 1 && mult2 + delta <= 10) mult2 += delta;
            }
            updateView();
        }

        function updateView() {
            const level = levels[currentLevelIndex];
            
            // Calculate current denominators
            const curD1 = level.d1 * mult1;
            const curD2 = level.d2 * mult2;
            const curN1 = level.n1 * mult1;
            const curN2 = level.n2 * mult2;

            // Update Text Displays
            document.getElementById('mult1-display').innerText = mult1;
            document.getElementById('mult2-display').innerText = mult2;
            
            document.getElementById('p1-num-current').innerText = curN1;
            document.getElementById('p1-den-current').innerText = curD1;
            document.getElementById('p2-num-current').innerText = curN2;
            document.getElementById('p2-den-current').innerText = curD2;

            // Draw SVGs
            document.getElementById('pizza1-svg').innerHTML = createPizzaSVG(level.n1, level.d1, mult1, level.c1);
            document.getElementById('pizza2-svg').innerHTML = createPizzaSVG(level.n2, level.d2, mult2, level.c2);

            // Check if denominators match
            const mergeBtn = document.getElementById('merge-btn');
            const statusMsg = document.getElementById('status-message');
            const p1Container = document.getElementById('pizza1-container');
            const p2Container = document.getElementById('pizza2-container');

            if (curD1 === curD2) {
                mergeBtn.disabled = false;
                mergeBtn.className = "bg-gradient-to-r from-green-400 to-green-600 text-white px-10 py-4 rounded-2xl font-black text-2xl transition-all duration-300 shadow-xl hover:scale-105 hover:shadow-2xl cursor-pointer animate-pulse";
                mergeBtn.innerText = "⭐ รวมถาดพิซซ่าได้เลย! ⭐";
                
                statusMsg.className = "text-xl font-bold text-green-700 mb-6 bg-green-100 px-6 py-2 rounded-2xl border-2 border-green-400 transition-colors duration-300 text-center w-full max-w-2xl";
                statusMsg.innerText = "เยี่ยมมาก! ขนาดชิ้นเท่ากันแล้ว (ตัวส่วนเท่ากัน) สามารถนำมารวมกันได้!";

                p1Container.classList.add('success-glow');
                p2Container.classList.add('success-glow');
            } else {
                mergeBtn.disabled = true;
                mergeBtn.className = "bg-gray-200 text-gray-400 px-10 py-4 rounded-2xl font-bold text-2xl transition-all duration-300 cursor-not-allowed border-2 border-gray-300";
                mergeBtn.innerText = "รวมถาดพิซซ่า! (ต้องการขนาดชิ้นเท่ากัน)";

                statusMsg.className = "text-xl font-bold text-blue-600 mb-6 bg-blue-50 px-6 py-2 rounded-2xl border-2 border-blue-200 transition-colors duration-300 text-center w-full max-w-2xl";
                statusMsg.innerText = "ชิ้นพิซซ่ายังขนาดไม่เท่ากัน! ลองใช้เครื่องสับ (x) เพิ่มดูสิ";

                p1Container.classList.remove('success-glow');
                p2Container.classList.remove('success-glow');
            }
        }

        function mergePizzas() {
            isMerged = true;
            const level = levels[currentLevelIndex];
            const commonDenom = level.d1 * mult1;
            const totalPieces = (level.n1 * mult1) + (level.n2 * mult2);

            // Hide original elements slightly
            document.getElementById('pizza1-container').classList.add('hidden');
            document.getElementById('pizza2-container').classList.add('hidden');
            document.querySelector('.text-5xl.text-gray-300').classList.add('hidden');
            document.getElementById('merge-btn').classList.add('hidden');
            document.getElementById('status-message').classList.add('hidden');

            // Show Result Area
            const resultArea = document.getElementById('result-area');
            resultArea.classList.remove('hidden');

            // Draw Combined SVG (Assuming sum <= 1 for prototype simplicity)
            // Using a gradient or just one color for simplicity, let's use a mixed color or just the first color
            // For better visual, let's just use a bright red for the final combined pizza
            document.getElementById('result-svg').innerHTML = createPizzaSVG(0, commonDenom, 1, '#ef4444', true, totalPieces);

            // Populate Equation
            document.getElementById('res-eq-n1').innerText = level.n1 * mult1;
            document.getElementById('res-eq-d1').innerText = commonDenom;
            document.getElementById('res-eq-n2').innerText = level.n2 * mult2;
            document.getElementById('res-eq-d2').innerText = commonDenom;
            
            document.getElementById('res-final-n').innerText = totalPieces;
            document.getElementById('res-final-d').innerText = commonDenom;
        }

        function nextLevel() {
            currentLevelIndex++;
            loadLevel();
        }

        // Start Game
        window.onload = loadLevel;
    </script>
</body>
</html>
